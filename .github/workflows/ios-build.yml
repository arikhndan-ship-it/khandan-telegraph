name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache CocoaPods and Flutter build artifacts
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            mobile/ios/.symlinks
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Write App Store Connect API Key
        shell: python
        run: |
          import os, json
          key = os.environ["API_KEY"]
          key_id = os.environ["KEY_ID"]
          os.makedirs(os.path.expanduser("~/private_keys"), exist_ok=True)
          os.makedirs(os.path.expanduser("~/.fastlane"), exist_ok=True)
          with open(os.path.expanduser("~/private_keys/AuthKey_%s.p8" % key_id), "w") as f:
              f.write(key)
          with open(os.path.expanduser("~/.fastlane/appstore_api_key.json"), "w") as f:
              json.dump({"key_id": key_id, "issuer_id": os.environ["ISSUER_ID"], "key": key, "in_house": False}, f)
          print("API key files written")
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Load saved distribution cert (if available)
        run: |
          if [ -n "${{ secrets.DIST_CERT_P12 }}" ]; then
            echo "${{ secrets.DIST_CERT_P12 }}" | base64 -d > /tmp/saved_cert.p12
            echo "Saved cert loaded"
          else
            echo "No saved cert found"
          fi

      - name: Cert and Profile Setup
        timeout-minutes: 10
        shell: python
        run: |
          import subprocess, os, glob, shutil, plistlib, json, base64, time, urllib.request, urllib.error
          
          KEY_PATH = os.path.expanduser("~/.fastlane/appstore_api_key.json")
          PROFILES_DIR = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          CERT_DIR = "/tmp/certs"
          os.makedirs(PROFILES_DIR, exist_ok=True)
          os.makedirs(CERT_DIR, exist_ok=True)
          
          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()
          
          def der_to_raw_es256sig(der):
              # Convert DER-encoded ECDSA signature to raw R||S (32+32 bytes).
              def read_int(data, i):
                  if data[i] != 0x02:
                      raise ValueError("expected INTEGER")
                  ln = data[i + 1]
                  start = i + 2
                  if ln == 0x81:
                      start = i + 3
                  elif ln > 0x80:
                      # long-form length not expected here
                      raise ValueError("long-form length unsupported")
                  n = int.from_bytes(data[start:start + ln], "big")
                  return n, start + ln
              i = 0
              if der[i] != 0x30:
                  raise ValueError("expected SEQUENCE")
              seq_len = der[i + 1]
              if seq_len == 0x81:
                  i = i + 3
              elif seq_len > 0x80:
                  raise ValueError("long-form length unsupported")
              else:
                  i = i + 2
              r, i = read_int(der, i)
              s, i = read_int(der, i)
              r = r.to_bytes(32, "big")
              s = s.to_bytes(32, "big")
              if len(r) > 32 or len(s) > 32:
                  raise ValueError("signature too large for ES256")
              return r.rjust(32, b"\x00") + s.rjust(32, b"\x00")
          
          def asc_token():
              # Build an App Store Connect API JWT (ES256) from the p8 key.
              with open(KEY_PATH) as f:
                  info = json.load(f)
              kid = info["key_id"]
              iss = info["issuer_id"]
              key_pem = info["key"]
              with open("/tmp/asc_key.p8", "w") as f:
                  f.write(key_pem)
              header = b64url(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}).encode())
              payload = b64url(json.dumps({"iss": iss, "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"}).encode())
              signing_input = (header + "." + payload).encode()
              r = subprocess.run(
                  ["openssl", "dgst", "-sha256", "-sign", "/tmp/asc_key.p8"],
                  input=signing_input, capture_output=True
              )
              if r.returncode != 0:
                  raise RuntimeError("openssl signing failed: %s" % r.stderr.decode())
              sig = b64url(der_to_raw_es256sig(r.stdout))
              return header + "." + payload + "." + sig
          
          def asc_request(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  method=method,
                  headers={"Authorization": "Bearer " + asc_token()},
              )
              with urllib.request.urlopen(req) as resp:
                  body = resp.read()
                  return json.loads(body) if body else {}
          
          def revoke_all_distribution_certs():
              print("=== Revoking orphaned distribution certificates via ASC API ===")
              data = asc_request("/v1/certificates?filter[certificateType]=DISTRIBUTION&limit=200")
              certs = data.get("data", [])
              print("Found %d distribution cert(s)" % len(certs))
              for c in certs:
                  cid = c["id"]
                  name = c.get("attributes", {}).get("name", "")
                  print("  Revoking %s (%s)..." % (cid, name))
                  try:
                      asc_request("/v1/certificates/%s" % cid, method="DELETE")
                      print("    revoked")
                  except urllib.error.HTTPError as e:
                      print("    FAILED %s: %s" % (e.code, e.read()[:200]))
              time.sleep(5)
          
          subprocess.run("gem install fastlane -q", shell=True, capture_output=True)

          # Use a dedicated keychain with a known password so codesign never
          # hangs waiting for a keychain prompt.
          KC = os.path.expanduser("~/Library/Keychains/ios-build.keychain-db")
          KCPASS = "khandan-build-keychain"

          # Check if we have a saved p12 in secrets (check /tmp/saved_cert.p12)
          saved_p12 = "/tmp/saved_cert.p12"
          cert_imported = False

          if os.path.exists(saved_p12) and os.path.getsize(saved_p12) > 100:
              print("Found saved p12 cert, importing...")
              # Create the dedicated keychain and import the saved cert into it.
              subprocess.run('security delete-keychain "%s" 2>/dev/null; true' % KC, shell=True)
              subprocess.run('security create-keychain -p %s "%s"' % (KCPASS, KC), shell=True)
              subprocess.run('security default-keychain -s "%s"' % KC, shell=True)
              subprocess.run('security unlock-keychain -p %s "%s"' % (KCPASS, KC), shell=True)
              r = subprocess.run(
                  'security import "%s" -k "%s" -P "" -T /usr/bin/codesign -T /usr/bin/security -A' % (saved_p12, KC),
                  shell=True, capture_output=True, text=True
              )
              if r.returncode == 0:
                  print("Saved cert imported successfully")
                  cert_imported = True
              else:
                  print("Saved cert import failed: %s" % r.stderr[-200:])

          # Verify the identity is actually visible after import
          if cert_imported:
              r = subprocess.run('security find-identity -v -p codesigning', shell=True, capture_output=True, text=True)
              print("Identities after saved-p12 import: %s" % r.stdout.strip() or "(none)")
              if "iPhone Distribution" not in r.stdout:
                  print("WARNING: identity not found after import, will re-import from CERT_DIR")
                  cert_imported = False

          if not cert_imported:
              # Try to get cert. If Apple's distribution cert limit is hit,
              # revoke the orphaned certs (whose private keys were lost in
              # earlier runs) and create a fresh one.
              print("=== Getting certificate ===")
              base_cmd = 'fastlane run cert development:false output_path:%s api_key_path:"%s"' % (CERT_DIR, KEY_PATH)
              r = subprocess.run(base_cmd, shell=True, capture_output=True, text=True)
              if r.returncode != 0 and "maximum number of available Distribution certificates" in r.stderr:
                  print("Cert limit reached. Revoking orphaned certs and retrying...")
                  try:
                      revoke_all_distribution_certs()
                  except Exception as e:
                      print("  Revoke step error: %s" % e)
                  r = subprocess.run(base_cmd, shell=True, capture_output=True, text=True)
              if r.returncode != 0:
                  print("Cert setup failed:")
                  for line in r.stderr.split('\n')[-5:]:
                      if line.strip(): print("  %s" % line[:200])
                  exit(1)
              print("Cert created/downloaded")
              # fastlane saves the cert (.cer) and private key (PEM) into
              # CERT_DIR. Build a proper PKCS12 bundle so the identity can
              # be persisted and reused on later runs.
              cer_files = [f for f in glob.glob("%s/*.cer" % CERT_DIR) if "signingRequest" not in os.path.basename(f)]
              key_files = [f for f in glob.glob("%s/*" % CERT_DIR)
                           if not f.endswith(".cer") and "signingRequest" not in os.path.basename(f)
                           and "private" not in os.path.basename(f)]
              if cer_files and key_files:
                  r3 = subprocess.run(
                      'openssl pkcs12 -export -inkey "%s" -in "%s" -out /tmp/dist_cert.p12 -passout pass:khandanp12 2>/dev/null' % (key_files[0], cer_files[0]),
                      shell=True
                  )
                  if r3.returncode == 0 and os.path.exists("/tmp/dist_cert.p12"):
                      print("  Built dist_cert.p12 from %s + %s" % (os.path.basename(key_files[0]), os.path.basename(cer_files[0])))
              if not os.path.exists("/tmp/dist_cert.p12"):
                  # Fallback: export the identity from the dedicated keychain
                  r2 = subprocess.run(
                      'security find-identity -v -p codesigning | grep "iPhone Distribution"',
                      shell=True, capture_output=True, text=True
                  )
                  if r2.stdout:
                      sha1 = r2.stdout.strip().split(" ")[1] if len(r2.stdout.strip().split(" ")) > 1 else ""
                      if sha1:
                          export_cmd = 'security export -k "%s" -t identities -f pkcs12 -P "khandanp12" -o /tmp/dist_cert.p12 "%s"' % (KC, sha1)
                          subprocess.run(export_cmd, shell=True, capture_output=True)
                          if os.path.exists("/tmp/dist_cert.p12"):
                              print("  Cert exported to /tmp/dist_cert.p12")

          # Create/refresh the dedicated keychain. In the saved-p12 path it
          # was already created and populated above, so only do this when we
          # went through fastlane cert (which used the default login keychain).
          if not cert_imported:
              subprocess.run('security delete-keychain "%s" 2>/dev/null; true' % KC, shell=True)
              subprocess.run('security create-keychain -p %s "%s"' % (KCPASS, KC), shell=True)
              subprocess.run('security default-keychain -s "%s"' % KC, shell=True)
              subprocess.run('security unlock-keychain -p %s "%s"' % (KCPASS, KC), shell=True)

          # If a saved p12 exists, import it into the dedicated keychain too.
          if os.path.exists(saved_p12) and os.path.getsize(saved_p12) > 100 and not cert_imported:
              r = subprocess.run(
                  'security import "%s" -k "%s" -P "" -T /usr/bin/codesign -T /usr/bin/security -A' % (saved_p12, KC),
                  shell=True, capture_output=True, text=True
              )
              if r.returncode == 0:
                  print("Saved cert imported into dedicated keychain")
                  cert_imported = True

          # 2. Unlock dedicated keychain and allow codesign access (prevents hangs)
          subprocess.run('security unlock-keychain -p %s "%s"' % (KCPASS, KC), shell=True)
          subprocess.run(
              'security set-key-partition-list -S apple-tool:,apple:,codesign:,system: -s -k %s "%s"' % (KCPASS, KC),
              shell=True, capture_output=True, text=True
          )
          
          # 3. Import any certs found in temp dir into the dedicated keychain
          print("=== Importing certificates ===")
          if os.path.exists("/tmp/dist_cert.p12"):
              print("  Import dist_cert.p12 (built this run)")
              subprocess.run('security import "/tmp/dist_cert.p12" -k "%s" -P "khandanp12" -T /usr/bin/codesign -T /usr/bin/security -A' % KC,
                           shell=True, capture_output=True)
          for f in glob.glob("%s/*" % CERT_DIR):
              fn = os.path.basename(f)
              if fn.endswith(".cer") and "signingRequest" not in fn:
                  print("  Import: %s" % fn)
                  subprocess.run('security import "%s" -k "%s" -T /usr/bin/codesign -T /usr/bin/security -A' % (f, KC),
                               shell=True, capture_output=True)
              elif fn.endswith(".p12"):
                  print("  Import p12: %s" % fn)
                  subprocess.run('security import "%s" -k "%s" -P "khandanp12" -T /usr/bin/codesign -T /usr/bin/security -A' % (f, KC),
                               shell=True, capture_output=True)
          
          # 4. Show available identities
          print("=== Available signing identities ===")
          subprocess.run("security find-identity -v -p codesigning", shell=True)
          
          # 5. Get provisioning profile
          print("=== Getting provisioning profile ===")
          for old in glob.glob(os.path.join(PROFILES_DIR, "*")):
              os.remove(old)
          
          r = subprocess.run(
              'fastlane run sigh app_identifier:com.khandan.telegraph force:true api_key_path:"%s"' % KEY_PATH,
              shell=True, capture_output=True, text=True
          )
          if r.returncode != 0:
              print("Sigh failed:")
              for line in r.stderr.split('\n')[-5:]:
                  if line.strip(): print("  %s" % line[:200])
              exit(1)
          
          # 6. Install and parse profile
          print("=== Installing profile ===")
          profile_name = None
          for root, dirs, files in os.walk(os.path.expanduser("~")):
              for f in files:
                  if f.endswith(".mobileprovision"):
                      src = os.path.join(root, f)
                      try:
                          r = subprocess.run(['security', 'cms', '-D', '-i', src], capture_output=True, text=True)
                          if r.returncode == 0:
                              plist = plistlib.loads(r.stdout.encode())
                              puid = plist.get("UUID", "")
                              pname = plist.get("Name", "")
                              if profile_name is None:
                                  profile_name = pname
                              dst = os.path.join(PROFILES_DIR, "%s.mobileprovision" % puid)
                              if os.path.abspath(src) != os.path.abspath(dst):
                                  shutil.copy2(src, dst)
                              print("  %s (%s)" % (pname, puid))
                      except:
                          pass
          
          print("Profile name: %s" % profile_name)
          if not profile_name:
              print("ERROR: No provisioning profile found!")
              exit(1)
          
          # 7. Write profile name for later steps
          with open("build_profile_name.txt", "w") as f:
              f.write(profile_name)

      - name: Save cert to GitHub secret for reuse
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUILD_GH_TOKEN }}
        run: |
          if [ -f /tmp/dist_cert.p12 ]; then
            base64 -i /tmp/dist_cert.p12 | gh secret set DIST_CERT_P12 --repo arikhndan-ship-it/khandan-telegraph
            echo "Saved cert p12 to DIST_CERT_P12 secret"
          else
            echo "No p12 available to save"
          fi

      - name: Flutter pub get
        timeout-minutes: 5
        run: flutter pub get

      - name: Build iOS (compile Dart)
        timeout-minutes: 25
        run: |
          export FLUTTER_FRONTEND_SERVER_MEMORY=4096
          echo "=== Building iOS (Dart compilation) ==="
          flutter build ios --release --no-codesign

      - name: Archive with signing
        timeout-minutes: 45
        run: |
          export PROFILE_NAME=$(cat build_profile_name.txt)
          echo "Profile: $PROFILE_NAME"
          
          echo "=== Configuring pbxproj for manual signing ==="
          python3 << 'PYEOF'
          import re, os
          pname = os.environ.get('PROFILE_NAME', '')
          print("Using profile:", pname)
          
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          
          content = re.sub(r'\t+CODE_SIGN_STYLE\s*=.*?;\n', '', content)
          content = re.sub(r'\t+DEVELOPMENT_TEAM\s*=.*?;\n', '', content)
          content = re.sub(r'\t+PROVISIONING_PROFILE_SPECIFIER\s*=.*?;\n', '', content)
          content = re.sub(r'\t+\"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]\"\s*=.*?;\n', '', content)
          
          t = '\t\t\t\t'
          settings = (
              t + 'CODE_SIGN_STYLE = Manual;\n'
              + t + 'DEVELOPMENT_TEAM = N6XDRH99C8;\n'
              + t + 'PROVISIONING_PROFILE_SPECIFIER = "' + pname + '";\n'
              + t + '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";\n'
          )
          content = content.replace(
              'PRODUCT_BUNDLE_IDENTIFIER = com.khandan.telegraph;\n',
              'PRODUCT_BUNDLE_IDENTIFIER = com.khandan.telegraph;\n' + settings
          )
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          print('pbxproj configured')
          PYEOF
          
          echo "=== Unlocking dedicated keychain and allowing codesign access ==="
          export KC="$HOME/Library/Keychains/ios-build.keychain-db"
          export KCPASS="khandan-build-keychain"
          security default-keychain -s "$KC" || true
          security unlock-keychain -p "$KCPASS" "$KC" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign:,system: -s -k "$KCPASS" "$KC" || true
          security list-keychains -d user -s "$KC"
          echo "=== Signing identities available ==="
          security find-identity -v -p codesigning

          echo "=== Archiving ==="
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            -destination 'generic/platform=iOS'

      - name: Export IPA
        timeout-minutes: 20
        run: |
          echo "=== Creating ExportOptions.plist ==="
          export PROFILE_NAME=$(cat build_profile_name.txt)
          python3 << 'PYEOF'
          import os
          pname = os.environ.get('PROFILE_NAME', '')
          print("Using profile for export:", pname)
          plist = f'''<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>N6XDRH99C8</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.khandan.telegraph</key>
                  <string>{pname}</string>
              </dict>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          '''
          with open('ios/ExportOptions.plist', 'w') as f:
              f.write(plist)
          print('ExportOptions.plist written')
          PYEOF
          
          echo "=== Exporting IPA ==="
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30

      - name: Upload cert for reuse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Distribution-Cert
          path: /tmp/dist_cert.p12
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore
