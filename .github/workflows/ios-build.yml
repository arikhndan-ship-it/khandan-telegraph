name: Build iOS IPA

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Write App Store Connect API Key
        shell: python
        run: |
          import os, json
          key = os.environ["API_KEY"]
          key_id = os.environ["KEY_ID"]
          
          os.makedirs(os.path.expanduser("~/private_keys"), exist_ok=True)
          with open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8"), "w") as f:
              f.write(key)
          
          os.makedirs(os.path.expanduser("~/.fastlane"), exist_ok=True)
          with open(os.path.expanduser("~/.fastlane/appstore_api_key.json"), "w") as f:
              json.dump({"key_id": key_id, "issuer_id": os.environ["ISSUER_ID"], "key": key, "in_house": False}, f)
          print("API key files written")
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Setup Fastlane
        run: gem install fastlane -q

      - name: Download Cert + Provisioning Profile
        run: |
          KEY_PATH="$HOME/.fastlane/appstore_api_key.json"
          fastlane run cert development:false output_path:/tmp/certs api_key_path:"$KEY_PATH"
          fastlane run sigh app_identifier:com.khandan.telegraph force:true api_key_path:"$KEY_PATH"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build and sign IPA
        run: flutter build ipa --release --export-method app-store --build-number=${{ github.run_number }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30
