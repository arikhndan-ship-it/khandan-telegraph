name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Write App Store Connect API Key
        shell: python
        run: |
          import os, json
          key = os.environ["API_KEY"]
          key_id = os.environ["KEY_ID"]
          
          os.makedirs(os.path.expanduser("~/private_keys"), exist_ok=True)
          with open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8"), "w") as f:
              f.write(key)
          
          os.makedirs(os.path.expanduser("~/.fastlane"), exist_ok=True)
          with open(os.path.expanduser("~/.fastlane/appstore_api_key.json"), "w") as f:
              json.dump({"key_id": key_id, "issuer_id": os.environ["ISSUER_ID"], "key": key, "in_house": False}, f)
          print("API key files written")
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Setup Fastlane
        run: gem install fastlane -q

      - name: Build IPA (retry until success)
        shell: python
        run: |
          import subprocess, os, time, json

          KEY_PATH = os.path.expanduser("~/.fastlane/appstore_api_key.json")
          MAX_RETRIES = 50
          RETRY_DELAY = 30

          def run_cmd(cmd, cwd=None):
              result = subprocess.run(cmd, shell=True, capture_output=True, text=True, cwd=cwd)
              if result.returncode != 0:
                  print(f"COMMAND FAILED:\n{cmd[:200]}")
                  print(result.stdout[-500:] if result.stdout else "")
                  print(result.stderr[-500:] if result.stderr else "")
              return result.returncode == 0

          for attempt in range(1, MAX_RETRIES + 1):
              print(f"\n{'='*60}")
              print(f"BUILD ATTEMPT {attempt}/{MAX_RETRIES}")
              print(f"{'='*60}")

              success = True

              # Step 1: Flutter pub get
              if not run_cmd("flutter pub get"):
                  print("pub get failed, retrying...")
                  time.sleep(RETRY_DELAY)
                  continue

              # Step 2: Install Certificate
              print("\n--- Installing Certificate ---")
              cert_ok = run_cmd(f'fastlane run cert development:false output_path:/tmp/certs api_key_path:"{KEY_PATH}"')
              # Try to import cert even if cert command reported an issue
              run_cmd(f'security import /tmp/certs/*.p12 -k ~/Library/Keychains/login.keychain-db -P "" -A 2>/dev/null || true')
              if not cert_ok:
                  # If cert failed, revoke all existing certs and retry
                  print("Cert step had an issue. Cleaning old certs and retrying...")
                  time.sleep(5)
                  continue

              # Step 3: Install Provisioning Profile
              print("\n--- Installing Provisioning Profile ---")
              profile_ok = run_cmd(f'fastlane run sigh app_identifier:com.khandan.telegraph force:true api_key_path:"{KEY_PATH}"')
              if not profile_ok:
                  print("Profile step failed, retrying...")
                  time.sleep(RETRY_DELAY)
                  continue

              # Step 4: Build and sign IPA with gym
              print("\n--- Building and Signing IPA ---")
              ios_dir = os.path.join(os.getcwd(), "ios")
              gym_cmd = (
                  f'fastlane gym '
                  f'scheme:Runner '
                  f'workspace:Runner.xcworkspace '
                  f'export_method:app-store '
                  f'output_directory:"../../build/ios/ipa" '
                  f'output_name:Khandan.ipa '
                  f'api_key_path:"{KEY_PATH}" '
                  f'xcargs:"-allowProvisioningUpdates DEVELOPMENT_TEAM=N6XDRH99C8"'
              )
              gym_ok = run_cmd(gym_cmd, cwd=ios_dir)
              if not gym_ok:
                  print("Gym build failed, retrying...")
                  time.sleep(RETRY_DELAY)
                  continue

              # All steps passed
              print("\n✅ IPA BUILD SUCCEEDED!")
              # Write a marker file so the next step knows it succeeded
              with open("build/ios/ipa/.build_success", "w") as f:
                  f.write("success")
              exit(0)

          print(f"\n❌ FAILED after {MAX_RETRIES} attempts")
          exit(1)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30
