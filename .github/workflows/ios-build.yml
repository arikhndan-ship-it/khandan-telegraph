name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Write App Store Connect API Key
        shell: python
        run: |
          import os, json
          key = os.environ["API_KEY"]
          key_id = os.environ["KEY_ID"]
          os.makedirs(os.path.expanduser("~/private_keys"), exist_ok=True)
          with open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8"), "w") as f:
              f.write(key)
          print("API key file written")
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

      - name: Configure project for Automatic signing
        shell: python
        run: |
          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx, "r") as f:
              content = f.read()
          
          # Add DEVELOPMENT_TEAM after PRODUCT_BUNDLE_IDENTIFIER for ALL Runner target configs
          content = content.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = com.khandan.telegraph;\n\t\t\t\tPRODUCT_NAME",
              "PRODUCT_BUNDLE_IDENTIFIER = com.khandan.telegraph;\n\t\t\t\tDEVELOPMENT_TEAM = N6XDRH99C8;\n\t\t\t\tPRODUCT_NAME"
          )
          
          with open(pbx, "w") as f:
              f.write(content)
          print("Added DEVELOPMENT_TEAM=N6XDRH99C8 to all Runner target configs")

      - name: Flutter pub get
        run: flutter pub get

      - name: Build IPA
        run: |
          export APP_STORE_CONNECT_API_KEY_ID="${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
          export APP_STORE_CONNECT_ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          export APP_STORE_CONNECT_KEY_PATH="$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          
          flutter build ipa --release --export-method app-store --build-number=${{ github.run_number }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30
