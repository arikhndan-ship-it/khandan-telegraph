name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Write App Store Connect API Key
        shell: python
        run: |
          import os, json
          key = os.environ["API_KEY"]
          key_id = os.environ["KEY_ID"]
          os.makedirs(os.path.expanduser("~/private_keys"), exist_ok=True)
          with open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8"), "w") as f:
              f.write(key)
          os.makedirs(os.path.expanduser("~/.fastlane"), exist_ok=True)
          with open(os.path.expanduser("~/.fastlane/appstore_api_key.json"), "w") as f:
              json.dump({"key_id": key_id, "issuer_id": os.environ["ISSUER_ID"], "key": key, "in_house": False}, f)
          print("API key files written")
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Setup Fastlane
        run: gem install fastlane -q

      - name: Full Build (cert + profile + build + sign + export)
        shell: python
        run: |
          import subprocess, os, glob, shutil, plistlib, json as j
          
          KEY_PATH = os.path.expanduser("~/.fastlane/appstore_api_key.json")
          PROFILES_DIR = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          CERT_DIR = "/tmp/certs"
          os.makedirs(PROFILES_DIR, exist_ok=True)
          os.makedirs(CERT_DIR, exist_ok=True)
          
          def run(cmd, cwd=None):
              r = subprocess.run(cmd, shell=True, capture_output=True, text=True, cwd=cwd)
              if r.stdout: print(r.stdout[-2000:])
              if r.returncode != 0 and r.stderr: print("ERR:", r.stderr[-1500:])
              return r
          
          # 1. GET CERT
          print("=== GET CERT ===")
          run(f'fastlane run cert development:false output_path:{CERT_DIR} api_key_path:"{KEY_PATH}"')
          
          # 2. IMPORT CERT
          print("\n=== IMPORT CERT ===")
          for f in glob.glob(f"{CERT_DIR}/*"):
              print(f"  Importing: {f}")
              run(f'security import "{f}" -k ~/Library/Keychains/login.keychain-db -P "" -A')
              run(f'security import "{f}" -k ~/Library/Keychains/login.keychain-db -P "temp" -A')
          
          # 3. LIST CERTS
          print("\n=== CERT LIST ===")
          run("security find-identity -v -p codesigning")
          
          # 4. GET PROFILE
          print("\n=== GET PROFILE ===")
          for old in glob.glob(os.path.join(PROFILES_DIR, "*")):
              os.remove(old)
          r = run(f'fastlane run sigh app_identifier:com.khandan.telegraph force:true api_key_path:"{KEY_PATH}"')
          
          # 5. PARSE AND INSTALL PROFILE
          print("\n=== INSTALL PROFILE ===")
          profile_name = None
          for root, dirs, files in os.walk(os.path.expanduser("~")):
              for f in files:
                  if f.endswith(".mobileprovision"):
                      src = os.path.join(root, f)
                      try:
                          with open(src, "rb") as pf:
                              data = pf.read()
                          plist_start = data.find(b"<?xml")
                          plist_end = data.find(b"</plist>")
                          if plist_start >= 0 and plist_end >= 0:
                              plist = plistlib.loads(data[plist_start:plist_end + len(b"</plist>")])
                              puid = plist.get("UUID", "")
                              pname = plist.get("Name", "")
                              if profile_name is None: profile_name = pname
                              dst = os.path.join(PROFILES_DIR, f"{puid}.mobileprovision")
                              if src != dst:
                                  shutil.copy2(src, dst)
                                  print(f"  Profile: {pname} -> {puid}.mobileprovision")
                      except Exception as e:
                          print(f"  Error: {e}")
          
          print(f"  Using profile: {profile_name}")
          
          # 6. CONFIGURE PROJECT
          print("\n=== CONFIGURE PROJECT ===")
          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx, "r") as f:
              content = f.read()
          
          settings = (
              '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
              '\t\t\t\tDEVELOPMENT_TEAM = N6XDRH99C8;\n'
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";\n'
              '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";\n'
          )
          content = content.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = com.khandan.telegraph;\n",
              "PRODUCT_BUNDLE_IDENTIFIER = com.khandan.telegraph;\n" + settings
          )
          with open(pbx, "w") as f:
              f.write(content)
          
          # 7. FLUTTER PUB GET + BUILD
          print("\n=== BUILD ===")
          r = run("flutter pub get")
          if r.returncode != 0:
              print("pub get failed")
              exit(1)
          
          # Build unsigned
          r = run("flutter build ios --release --no-codesign")
          if r.returncode != 0:
              print("flutter build failed")
              exit(1)
          
          # Archive with signing
          print("\n=== ARCHIVE ===")
          r = run(
              'xcodebuild archive '
              '-workspace ios/Runner.xcworkspace '
              '-scheme Runner '
              '-configuration Release '
              '-archivePath build/ios/Runner.xcarchive '
              'CODE_SIGN_STYLE=Manual '
              f'PROVISIONING_PROFILE_SPECIFIER="{profile_name}" '
              'DEVELOPMENT_TEAM=N6XDRH99C8 '
              'CODE_SIGN_IDENTITY="iPhone Distribution"'
          )
          if r.returncode != 0:
              print("Archive failed")
              exit(1)
          
          # Export
          print("\n=== EXPORT IPA ===")
          os.makedirs("build/ios/Export", exist_ok=True)
          with open("build/ios/Export/ExportOptions.plist", "w") as f:
              f.write('<?xml version="1.0" encoding="UTF-8"?>\n'
                  '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
                  '<plist version="1.0"><dict>\n'
                  '<key>method</key><string>app-store</string>\n'
                  '<key>teamID</key><string>N6XDRH99C8</string>\n'
                  '<key>signingStyle</key><string>manual</string>\n'
                  '<key>uploadBitcode</key><false/>\n'
                  '<key>uploadSymbols</key><true/>\n'
                  '</dict></plist>')
          
          r = run(
              'xcodebuild -exportArchive '
              '-archivePath build/ios/Runner.xcarchive '
              '-exportPath build/ios/ipa '
              '-exportOptionsPlist build/ios/Export/ExportOptions.plist'
          )
          if r.returncode != 0:
              print("Export failed")
              exit(1)
          
          print("\n✅ IPA BUILD AND EXPORT SUCCESSFUL!")
          exit(0)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30
