name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Write App Store Connect API Key
        shell: python
        run: |
          import os
          key = os.environ["API_KEY"]
          key_id = os.environ["KEY_ID"]
          key_dir = os.path.expanduser("~/private_keys")
          os.makedirs(key_dir, exist_ok=True)
          p8_path = os.path.join(key_dir, "AuthKey_%s.p8" % key_id)
          with open(p8_path, "w") as f:
              f.write(key)
          print("API key written: %s" % p8_path)
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

      - name: Flutter pub get
        timeout-minutes: 5
        run: flutter pub get

      - name: Build IPA (auto signing via API key)
        timeout-minutes: 30
        run: |
          export APP_STORE_CONNECT_API_KEY_ID="${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
          export APP_STORE_CONNECT_ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          export APP_STORE_CONNECT_KEY_PATH="$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          
          echo "=== Env vars set ==="
          echo "KEY_ID: $APP_STORE_CONNECT_API_KEY_ID"
          echo "ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID"
          echo "KEY_PATH: $APP_STORE_CONNECT_KEY_PATH"
          
          flutter build ipa --release --export-method app-store --build-number=27

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30
