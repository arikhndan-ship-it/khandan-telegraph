name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Write App Store Connect API Key
        shell: python
        run: |
          import os, json
          key = os.environ["API_KEY"]
          key_id = os.environ["KEY_ID"]
          
          os.makedirs(os.path.expanduser("~/private_keys"), exist_ok=True)
          with open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8"), "w") as f:
              f.write(key)
          
          os.makedirs(os.path.expanduser("~/.fastlane"), exist_ok=True)
          with open(os.path.expanduser("~/.fastlane/appstore_api_key.json"), "w") as f:
              json.dump({"key_id": key_id, "issuer_id": os.environ["ISSUER_ID"], "key": key, "in_house": False}, f)
          print("API key files written")
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Setup Fastlane
        run: gem install fastlane -q

      - name: Get cert + profile + configure project
        run: |
          KEY_PATH="$HOME/.fastlane/appstore_api_key.json"
          
          # Get certificate
          fastlane run cert development:false output_path:/tmp/certs api_key_path:"$KEY_PATH"
          
          # Import certificate
          security import /tmp/certs/*.p12 -k ~/Library/Keychains/login.keychain-db -P "" -A 2>/dev/null || true
          security import /tmp/certs/*.cer -k ~/Library/Keychains/login.keychain-db -A 2>/dev/null || true
          
          # Get provisioning profile
          fastlane run sigh app_identifier:com.khandan.telegraph force:true api_key_path:"$KEY_PATH"
          
          # Copy profile to Xcode provisioning profile directory
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          find ~/Library -name "*.mobileprovision" -exec cp {} ~/Library/MobileDevice/Provisioning\ Profiles/ \; 2>/dev/null || true
          find /tmp -name "*.mobileprovision" -exec cp {} ~/Library/MobileDevice/Provisioning\ Profiles/ \; 2>/dev/null || true
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
          
          echo "Available signing certs:"
          security find-identity -v -p codesigning

      - name: Set manual signing in Xcode project
        shell: python
        run: |
          import re
          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx, "r") as f:
              content = f.read()
          
          # Runner target build config UUIDs: Debug, Release, Profile
          target_ids = ["97C14706", "97C14707", "249021D4"]
          
          for tid in target_ids:
              # Find the block: starts with whitespace + tid + whitespace + isa
              pattern = rf'(\s*{tid}\s+.*?\{{\s*)(.*?)(\s*}}\s*;)'
              def replacer(m):
                  pre = m.group(1)
                  body = m.group(2)
                  post = m.group(3)
                  # Add CODE_SIGN_STYLE and DEVELOPMENT_TEAM if not present
                  if "CODE_SIGN_STYLE" not in body:
                      body += "\n\t\t\t\tCODE_SIGN_STYLE = Manual;"
                  if "DEVELOPMENT_TEAM" not in body:
                      body += "\n\t\t\t\tDEVELOPMENT_TEAM = N6XDRH99C8;"
                  return pre + body + post
              content = re.sub(pattern, replacer, content, flags=re.DOTALL)
          
          with open(pbx, "w") as f:
              f.write(content)
          print("Updated project.pbxproj with manual signing settings")

      - name: Flutter pub get
        run: flutter pub get

      - name: Build IPA
        run: |
          flutter build ipa --release --export-method app-store --build-number=${{ github.run_number }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30
