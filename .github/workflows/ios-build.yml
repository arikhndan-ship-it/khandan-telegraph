name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Write App Store Connect API Key
        shell: python
        run: |
          import os, json
          key = os.environ["API_KEY"]
          key_id = os.environ["KEY_ID"]
          os.makedirs(os.path.expanduser("~/private_keys"), exist_ok=True)
          os.makedirs(os.path.expanduser("~/.fastlane"), exist_ok=True)
          with open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8"), "w") as f:
              f.write(key)
          with open(os.path.expanduser("~/.fastlane/appstore_api_key.json"), "w") as f:
              json.dump({"key_id": key_id, "issuer_id": os.environ["ISSUER_ID"], "key": key, "in_house": False}, f)
          print("API key files written")
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Install cert, profile, configure signing
        shell: python
        run: |
          import subprocess, os, glob, shutil, plistlib
          
          KEY_PATH = os.path.expanduser("~/.fastlane/appstore_api_key.json")
          PROFILES_DIR = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          CERT_DIR = "/tmp/certs"
          os.makedirs(PROFILES_DIR, exist_ok=True)
          os.makedirs(CERT_DIR, exist_ok=True)
          
          def run(cmd, check=True):
              r = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              if r.stdout and "fastlane" not in cmd[:15]:
                  for line in r.stdout.split('\n')[-5:]:
                      if line.strip(): print(f"  {line[:200]}")
              if r.returncode != 0 and r.stderr:
                  for line in r.stderr.split('\n')[-5:]:
                      if line.strip(): print(f"  ERR: {line[:200]}")
              if check and r.returncode != 0:
                  print(f"FAILED: {cmd[:80]}")
                  exit(r.returncode)
              return r
          
          run("gem install fastlane -q")
          
          # Get cert
          print("Getting cert...")
          run(f'fastlane run cert development:false output_path:{CERT_DIR} api_key_path:"{KEY_PATH}"')
          
          # Import cert
          print("Importing cert...")
          run('security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db', check=False)
          run('security set-keychain-settings -lut 3600 ~/Library/Keychains/login.keychain-db', check=False)
          for f in glob.glob(f"{CERT_DIR}/*"):
              fn = os.path.basename(f)
              if "signingRequest" not in fn and "private" not in fn:
                  print(f"  Import: {fn}")
                  run(f'security import "{f}" -k ~/Library/Keychains/login.keychain-db -P "" -A', check=False)
          
          print("Checking certs...")
          run("security find-identity -v -p codesigning")
          
          # Get profile
          print("Getting profile...")
          for old in glob.glob(os.path.join(PROFILES_DIR, "*")):
              os.remove(old)
          run(f'fastlane run sigh app_identifier:com.khandan.telegraph force:true api_key_path:"{KEY_PATH}"')
          
          # Install profile
          print("Installing profile...")
          profile_name = None
          for root, dirs, files in os.walk(os.path.expanduser("~")):
              for f in files:
                  if f.endswith(".mobileprovision"):
                      src = os.path.join(root, f)
                      try:
                          with open(src, "rb") as pf:
                              data = pf.read()
                          plist_start = data.find(b"<?xml")
                          if plist_start >= 0:
                              plist = plistlib.loads(data[plist_start:])
                              puid = plist.get("UUID", "")
                              pname = plist.get("Name", "")
                              if profile_name is None: profile_name = pname
                              dst = os.path.join(PROFILES_DIR, f"{puid}.mobileprovision")
                              shutil.copy2(src, dst)
                              print(f"  {pname} ({puid})")
                      except Exception as e:
                          print(f"  Skipping {f}: {e}")
          
          print(f"Profile: {profile_name}")
          
          # Write profile name to file for next step
          with open("build_profile_name.txt", "w") as f:
              f.write(profile_name or "")
          
          # Configure project for manual signing
          print("Configuring project...")
          pbx = "ios/Runner.xcodeproj/project.pbxproj"
          with open(pbx, "r") as f:
              content = f.read()
          
          import re
          content = re.sub(r'\t+CODE_SIGN_STYLE\s*=.*?;\n', '', content)
          content = re.sub(r'\t+DEVELOPMENT_TEAM\s*=.*?;\n', '', content)
          content = re.sub(r'\t+PROVISIONING_PROFILE_SPECIFIER\s*=.*?;\n', '', content)
          content = re.sub(r'\t+"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]"\s*=.*?;\n', '', content)
          
          settings = (
              '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
              '\t\t\t\tDEVELOPMENT_TEAM = N6XDRH99C8;\n'
              f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";\n'
              '\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";\n'
          )
          content = content.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = com.khandan.telegraph;\n",
              "PRODUCT_BUNDLE_IDENTIFIER = com.khandan.telegraph;\n" + settings
          )
          with open(pbx, "w") as f:
              f.write(content)
          print("Done")

      - name: Build IPA
        run: |
          flutter pub get
          flutter build ipa --release --export-method app-store --build-number=20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30
