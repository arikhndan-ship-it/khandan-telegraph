name: Build iOS IPA

on:
  workflow_dispatch: # Manual trigger only

jobs:
  build-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Configure App Store Connect API Key
        uses: apple-actions/setup-appstore-connect-api-key@v2
        with:
          api-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Build IPA for App Store
        run: flutter build ipa --release --export-method app-store --build-number=${{ github.run_number }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Khandan-iOS-AppStore
          path: mobile/build/ios/ipa/*.ipa
          compression-level: 0
          retention-days: 30
